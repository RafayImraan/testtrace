version: "3.9"

# ---------------------------------------------------------------------
# Test Trace & Automate - full stack
# `docker compose up --build` starts everything with seeded demo data.
# ---------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: tta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tta_pass}
      POSTGRES_DB: ${POSTGRES_DB:-test_trace_automate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tta} -d ${POSTGRES_DB:-test_trace_automate}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tta-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-tta}:${POSTGRES_PASSWORD:-tta_pass}@postgres:5432/${POSTGRES_DB:-test_trace_automate}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_super_long_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://frontend:80,http://backend:4000
      RUN_MIGRATIONS_ON_START: "true"
      RUN_SEED_ON_START: "true"
      UPLOAD_DIR: /app/backend/uploads
      SAMPLE_APP_URL: http://sample-app:5000
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: ""
      VITE_SOCKET_URL: ""

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: tta-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      sample-app:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tta}:${POSTGRES_PASSWORD:-tta_pass}@postgres:5432/${POSTGRES_DB:-test_trace_automate}
      BACKEND_URL: http://backend:4000
      WORKER_EMAIL: ${WORKER_EMAIL:-lead@tta.local}
      WORKER_PASSWORD: ${WORKER_PASSWORD:-Lead@123}
      WORKER_ID: ${WORKER_ID:-worker-1}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-3000}
      AUTOMATION_HEADLESS: "true"
      SAMPLE_APP_URL: http://sample-app:5000
    volumes:
      - uploads:/app/uploads
      - worker-artifacts:/app/worker/.artifacts

  sample-app:
    build:
      context: .
      dockerfile: sample-app/Dockerfile
    container_name: tta-sample-app
    restart: unless-stopped
    environment:
      PORT: 5000
      BUG_MODE: ${BUG_MODE:-true}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
  worker-artifacts:
